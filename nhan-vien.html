<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nhân viên | Quản lý phiếu yêu cầu</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body data-page="nhan-vien">

    <!-- Khôi phục trạng thái menu trước khi vẽ để tránh giật layout -->
    <script>try{if(localStorage.getItem("pyc_menu")==="an")document.body.classList.add("sidebar-collapsed");}catch(e){}</script>
    <div class="app">
        <aside class="sidebar" id="sidebar"></aside>
        <div class="nav-backdrop" id="navBackdrop"></div>

        <div class="main-area">
            <header class="topbar" id="topbar"></header>

            <div class="page">
                <div class="page-head">
                    <div>
                        <h2>Danh sách nhân viên<small>Quản lý tài khoản, phòng ban và chức danh nhân sự</small></h2>
                    </div>
                    <div class="spacer"></div>
                    <button type="button" class="btn btn-primary" id="btnAddStaff">&#43; Thêm nhân viên</button>
                </div>

                <section class="card mb-0">
                    <div class="card-head">
                        <h3>Nhân sự <small>(<span id="staffCount">0</span> người)</small></h3>
                    </div>

                    <div class="toolbar">
                        <div class="search-box">
                            <span class="ico">&#128269;</span>
                            <input type="text" id="fSearchNV" class="form-control"
                                   placeholder="Tìm theo họ tên, tên đăng nhập, email, số điện thoại...">
                        </div>
                        <select id="fPhongNV" class="form-control"></select>
                        <select id="fChucDanh" class="form-control"></select>
                    </div>

                    <div class="table-wrap">
                        <table class="data" style="min-width:1020px">
                            <thead>
                                <tr>
                                    <th>Họ tên / Tên đăng nhập</th>
                                    <th>Email / Điện thoại</th>
                                    <th>Phòng ban</th>
                                    <th>Chức danh</th>
                                    <th>Người quản lý</th>
                                    <th class="text-center">Phiếu đang phụ trách</th>
                                    <th>Ngày tạo</th>
                                    <th class="text-right">Thao tác</th>
                                </tr>
                            </thead>
                            <tbody id="staffBody"></tbody>
                        </table>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <div id="modal-root" class="backdrop"></div>
    <div class="toast-wrap"></div>

    <script src="js/data.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
